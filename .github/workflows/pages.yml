name: Deploy ISO picker to Pages
on:
  push:
    branches: [main]
    paths: ['web/pages/**', 'scripts/test_pages.mjs', 'scripts/package_pages.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check local disc handling
        run: node scripts/test_pages.mjs
      - name: Package launcher and verified browser player
        run: python3 scripts/package_pages.py
      - uses: actions/configure-pages@v5
      # Only the launcher and four pinned player files. Never include an ISO or states.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages
      - uses: actions/deploy-pages@v4
        id: deployment
