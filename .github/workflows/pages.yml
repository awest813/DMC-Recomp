name: Deploy ISO picker to Pages
on:
  push:
    branches: [dmc-port]
    paths: ['web/pages/**', 'scripts/test_pages.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check local disc handling
        run: node scripts/test_pages.mjs
      - uses: actions/configure-pages@v5
      # Only these authored static files are published. No build output or game data.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/pages
      - uses: actions/deploy-pages@v4
        id: deployment
